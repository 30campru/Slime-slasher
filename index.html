
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-Frame Gaze Slime Defeater</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    // ==========================================
    // GAME STATE
    // ==========================================
    AFRAME.registerComponent('game-state', {
      init: function () {
        this.el.gameOver = false;
        this.el.gameWon = false;
      }
    });


    // ==========================================
    // EYE TRACKING
    // ==========================================
    AFRAME.registerComponent('eye-track-player', {
      schema: {
        maxOffset: { type: 'number', default: 0.025 }
      },

      init: function () {
        this.eye = this.el.parentEl;
        this.camera = null;

        this.eyeWorldPosition = new THREE.Vector3();
        this.cameraWorldPosition = new THREE.Vector3();
        this.direction = new THREE.Vector3();
        this.eyeQuaternion = new THREE.Quaternion();

        this.pupilDistance = 0.055;
      },

      tick: function () {
        if (!this.eye || !this.eye.object3D) {
          this.eye = this.el.parentEl;
        }

        if (!this.camera || !this.camera.object3D) {
          this.camera = document.querySelector('[camera]');
        }

        if (
          !this.eye ||
          !this.eye.object3D ||
          !this.camera ||
          !this.camera.object3D
        ) {
          return;
        }

        this.eye.object3D.getWorldPosition(
          this.eyeWorldPosition
        );

        this.camera.object3D.getWorldPosition(
          this.cameraWorldPosition
        );

        // Direction toward the player.
        this.direction
          .copy(this.cameraWorldPosition)
          .sub(this.eyeWorldPosition);

        // Convert into the white eye's local coordinates.
        this.eye.object3D.getWorldQuaternion(
          this.eyeQuaternion
        );

        this.eyeQuaternion.invert();
        this.direction.applyQuaternion(
          this.eyeQuaternion
        );

        if (this.direction.lengthSq() < 0.000001) {
          return;
        }

        this.direction.normalize();

        const max = this.data.maxOffset;

        const pupilX = THREE.MathUtils.clamp(
          this.direction.x * 0.07,
          -max,
          max
        );

        const pupilY = THREE.MathUtils.clamp(
          this.direction.y * 0.07,
          -max,
          max
        );

        // Keep the pupil on the front of the white eye.
        const pupilZ = Math.sqrt(
          Math.max(
            0.0001,
            this.pupilDistance * this.pupilDistance -
            pupilX * pupilX -
            pupilY * pupilY
          )
        );

        this.el.object3D.position.set(
          pupilX,
          pupilY,
          pupilZ
        );
      }
    });


    // ==========================================
    // SLIME CHASING, TURNING AND GAME OVER
    // ==========================================
    AFRAME.registerComponent('slime-chase', {
      schema: {
        speed: { type: 'number', default: 0.25 },
        loseDistance: { type: 'number', default: 0.8 },
        turnSpeed: { type: 'number', default: 150 }
      },

      init: function () {
        this.camera = document.querySelector('[camera]');

        this.cameraPosition = new THREE.Vector3();
        this.slimePosition = new THREE.Vector3();

        this.defeated = false;
        this.isTurning = false;

        // Start turning after passing 45 degrees.
        this.turnThreshold =
          THREE.MathUtils.degToRad(45);

        // Finish turning when nearly facing the player.
        this.alignedThreshold =
          THREE.MathUtils.degToRad(2);
      },

      tick: function (time, delta) {
        const scene = this.el.sceneEl;

        // Stop movement after a win, loss or defeat.
        if (scene.gameOver || this.defeated) return;

        if (!this.camera || !this.camera.object3D) {
          this.camera = document.querySelector('[camera]');
          if (!this.camera) return;
        }

        this.camera.object3D.getWorldPosition(
          this.cameraPosition
        );

        this.el.object3D.getWorldPosition(
          this.slimePosition
        );

        const dx =
          this.cameraPosition.x - this.slimePosition.x;

        const dz =
          this.cameraPosition.z - this.slimePosition.z;

        const distance = Math.sqrt(dx * dx + dz * dz);

        // GAME OVER when a slime reaches the player.
        if (distance <= this.data.loseDistance) {
          scene.gameOver = true;

          const screen = document.getElementById(
            'game-over-screen'
          );

          if (screen) {
            screen.style.display = 'flex';
          }

          return;
        }

        if (distance === 0) return;

        const slime = this.el.object3D;

        // Slime's face points along local positive Z.
        const targetYaw = Math.atan2(dx, dz);
        const currentYaw = slime.rotation.y;

        // Find the shortest rotation toward the player.
        const angleDifference = Math.atan2(
          Math.sin(targetYaw - currentYaw),
          Math.cos(targetYaw - currentYaw)
        );

        // Begin turning past the 45-degree mark.
        if (
          Math.abs(angleDifference) > this.turnThreshold
        ) {
          this.isTurning = true;
        }

        // Finish the turn smoothly.
        if (this.isTurning) {
          const turnStep =
            THREE.MathUtils.degToRad(
              this.data.turnSpeed
            ) * Math.min(delta, 50) / 1000;

          if (
            Math.abs(angleDifference) <=
              this.alignedThreshold ||
            Math.abs(angleDifference) <= turnStep
          ) {
            slime.rotation.y = targetYaw;
            this.isTurning = false;
          } else {
            slime.rotation.y +=
              Math.sign(angleDifference) * turnStep;
          }
        }

        // Chase at this slime's individual speed.
        const step = Math.min(
          this.data.speed * Math.min(delta, 50) / 1000,
          distance - this.data.loseDistance
        );

        slime.position.x += (dx / distance) * step;
        slime.position.z += (dz / distance) * step;
      }
    });


    // ==========================================
    // SLIME DEFEAT AND WIN DETECTION
    // ==========================================
    AFRAME.registerComponent('defeatable-slime', {
      init: function () {
        const el = this.el;
        this.defeated = false;

        el.addEventListener('click', () => {
          const scene = el.sceneEl;

          // Ignore clicks after a win, loss or prior defeat.
          if (this.defeated || scene.gameOver) return;

          this.defeated = true;

          // Stop this slime chasing and turning.
          const chase = el.components['slime-chase'];

          if (chase) {
            chase.defeated = true;
          }

          el.removeAttribute('slime-chase');

          // Play the sword slash animation.
          const sword = document.querySelector('#sword');

          if (sword) {
            sword.emit('start-slash');
          }

          // Shrink the slime and all its eyes.
          el.setAttribute('animation__defeat', {
            property: 'scale',
            from: '1 1 1',
            to: '0 0 0',
            dur: 300,
            easing: 'easeInBack'
          });

          // Check whether every slime has been defeated.
          const allSlimes = Array.from(
            document.querySelectorAll('[defeatable-slime]')
          );

          const isLastSlime =
            allSlimes.length > 0 &&
            allSlimes.every((slime) => {
              const component =
                slime.components['defeatable-slime'];

              return component && component.defeated;
            });

          // Lock the game immediately once the final
          // slime is defeated, so a loss cannot override the win.
          if (isLastSlime) {
            scene.gameOver = true;
            scene.gameWon = true;
          }

          // Remove the slime after its defeat animation.
          setTimeout(() => {
            if (el.parentNode) {
              el.parentNode.removeChild(el);
            }

            // Show the victory screen after the final defeat.
            if (isLastSlime) {
              const winScreen = document.getElementById(
                'win-screen'
              );

              if (winScreen) {
                winScreen.style.display = 'flex';
              }
            }
          }, 350);
        });
      }
    });
  </script>
</head>

<body style="margin: 0;">

  <a-scene
    game-state
    background="color: #1a1a2e">

    <!-- ======================================
         GROUND
         ====================================== -->
    <a-plane
      position="0 -1 0"
      rotation="-90 0 0"
      color="tan"
      width="20"
      height="20">
    </a-plane>


    <!-- ======================================
         PLAYER AND CAMERA
         ====================================== -->
    <a-camera
      position="0 1.6 0"
      look-controls
      wasd-controls>

      <!-- GAZE CURSOR -->
      <a-cursor
        id="game-cursor"
        raycaster="objects: .targetable"
        cursor="fuse: true; fuseTimeout: 2000"
        material="color: #00ffcc; shader: flat"
        position="0 0 -1"
        geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
        animation__fusing="
          property: scale;
          startEvents: fusing;
          easing: linear;
          dur: 2000;
          from: 1 1 1;
          to: 0.1 0.1 0.1"
        animation__fuseend="
          property: scale;
          startEvents: mouseleave;
          dur: 100;
          to: 1 1 1">
      </a-cursor>


      <!-- SWORD -->
      <a-entity
        id="sword"
        position="0.35 -0.35 -0.7"
        animation__slash="
          property: rotation;
          startEvents: start-slash;
          from: 0 0 0;
          to: 0 0 55;
          dur: 180;
          easing: easeOutQuad"
        animation__return="
          property: rotation;
          startEvents: animationcomplete__slash;
          from: 0 0 55;
          to: 0 0 0;
          dur: 180;
          easing: easeInOutQuad">

        <a-box
          position="0 0 0"
          scale="0.15 0.03 0.03"
          material="color: #8c763d">
        </a-box>

        <a-cylinder
          position="0 -0.1 0"
          radius="0.015"
          height="0.15"
          material="color: #4a3728">
        </a-cylinder>

        <a-box
          position="0 0.3 0"
          scale="0.04 0.5 0.01"
          material="
            color: #d1d5db;
            metalness: 0.8;
            roughness: 0.2">
        </a-box>

      </a-entity>
    </a-camera>


    <!-- ======================================
         SLIME 1 - SPEED 1
         ====================================== -->
    <a-entity
      position="-1.3 0 -3"
      defeatable-slime
      slime-chase="speed: 1; loseDistance: 0.8; turnSpeed: 150">

      <a-sphere
        class="targetable"
        radius="0.5"
        material="
          color: #2ecc71;
          opacity: 0.85;
          roughness: 0.3">
      </a-sphere>

      <!-- Left eye -->
      <a-sphere
        radius="0.08"
        position="-0.15 0.12 0.40"
        material="color: #ffffff">

        <a-sphere
          radius="0.04"
          position="0 0 0.055"
          material="color: #000000"
          eye-track-player>
        </a-sphere>
      </a-sphere>

      <!-- Right eye -->
      <a-sphere
        radius="0.08"
        position="0.15 0.12 0.40"
        material="color: #ffffff">

        <a-sphere
          radius="0.04"
          position="0 0 0.055"
          material="color: #000000"
          eye-track-player>
        </a-sphere>
      </a-sphere>

    </a-entity>


    <!-- ======================================
         SLIME 2 - SPEED 1.5
         ====================================== -->
    <a-entity
      position="0 0 -3"
      defeatable-slime
      slime-chase="speed: 1.5; loseDistance: 0.8; turnSpeed: 150">

      <a-sphere
        class="targetable"
        radius="0.5"
        material="
          color: #2ecc71;
          opacity: 0.85;
          roughness: 0.3">
      </a-sphere>

      <!-- Left eye -->
      <a-sphere
        radius="0.08"
        position="-0.15 0.12 0.40"
        material="color: #ffffff">

        <a-sphere
          radius="0.04"
          position="0 0 0.055"
          material="color: #000000"
          eye-track-player>
        </a-sphere>
      </a-sphere>

      <!-- Right eye -->
      <a-sphere
        radius="0.08"
        position="0.15 0.12 0.40"
        material="color: #ffffff">

        <a-sphere
          radius="0.04"
          position="0 0 0.055"
          material="color: #000000"
          eye-track-player>
        </a-sphere>
      </a-sphere>

    </a-entity>


    <!-- ======================================
         SLIME 3 - SPEED 0.5
         ====================================== -->
    <a-entity
      position="1.3 0 -3"
      defeatable-slime
      slime-chase="speed: 0.5; loseDistance: 0.8; turnSpeed: 150">

      <a-sphere
        class="targetable"
        radius="0.5"
        material="
          color: #2ecc71;
          opacity: 0.85;
          roughness: 0.3">
      </a-sphere>

      <!-- Left eye -->
      <a-sphere
        radius="0.08"
        position="-0.15 0.12 0.40"
        material="color: #ffffff">

        <a-sphere
          radius="0.04"
          position="0 0 0.055"
          material="color: #000000"
          eye-track-player>
        </a-sphere>
      </a-sphere>

      <!-- Right eye -->
      <a-sphere
        radius="0.08"
        position="0.15 0.12 0.40"
        material="color: #ffffff">

        <a-sphere
          radius="0.04"
          position="0 0 0.055"
          material="color: #000000"
          eye-track-player>
        </a-sphere>
      </a-sphere>

    </a-entity>

  </a-scene>


  <!-- ========================================
       GAME OVER SCREEN
       ======================================== -->
  <div
    id="game-over-screen"
    style="
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(10, 10, 25, 0.94);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    ">

    <h1
      style="
        font-size: clamp(42px, 8vw, 64px);
        color: #ff4545;
        margin: 0 0 10px;
      ">
      GAME OVER
    </h1>

    <p style="font-size: 24px; margin: 10px;">
      A slime caught you!
    </p>

    <button
      onclick="location.reload()"
      style="
        font-size: 22px;
        padding: 14px 28px;
        margin-top: 20px;
        background: #00cc99;
        color: #101020;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      ">
      PLAY AGAIN
    </button>

  </div>


  <!-- ========================================
       VICTORY SCREEN
       ======================================== -->
  <div
    id="win-screen"
    style="
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(8, 25, 30, 0.95);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
    ">

    <h1
      style="
        font-size: clamp(48px, 9vw, 76px);
        color: #39ff9c;
        margin: 0 0 12px;
        text-shadow: 0 0 18px rgba(57, 255, 156, 0.4);
      ">
      YOU WIN!
    </h1>

    <p
      style="
        font-size: clamp(20px, 4vw, 28px);
        margin: 8px;
      ">
      All slimes defeated!
    </p>

    <p
      style="
        font-size: 18px;
        color: #b9f7d8;
        margin: 8px 0 20px;
      ">
      You're the ultimate Slime Slasher!
    </p>

    <button
      onclick="location.reload()"
      style="
        font-size: 22px;
        font-weight: bold;
        padding: 15px 32px;
        margin-top: 15px;
        background: #39ff9c;
        color: #10251c;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(57, 255, 156, 0.25);
      ">
      PLAY AGAIN
    </button>

  </div>

</body>
</html>
