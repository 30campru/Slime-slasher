<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame Gaze Slime Defeater</title>
    <!-- Include the main A-Frame library -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      // Custom component attached to each slime to handle the interaction
      AFRAME.registerComponent('defeatable-slime', {
        init: function () {
          const el = this.el;
          const sword = document.querySelector('#sword');

          // Triggered when the user stares at the slime for the 5000ms fuse duration
          el.addEventListener('click', function () {
            // 1. Play the slash animation on the sword
            sword.emit('start-slash');
            
            // 2. Make the slime shrink down dramatically before disappearing
            el.setAttribute('animation', {
              property: 'scale',
              to: '0 0 0',
              dur: 300,
              easing: 'easeInBack'
            });

            // 3. Completely remove the slime from the scene after the animation completes
            setTimeout(() => {
              el.parentNode.removeChild(el);
            }, 300);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #1a1a2e">
      
      <!-- Ambient and directional lighting -->
      
      

      <!-- Grid Floor -->
      <a-grid src="https://aframe.io" repeat="100 100"></a-grid>

      <!-- PLAYER / CAMERA SYSTEM -->
      <!-- The camera serves as the player's eyes -->
      
        
        <!-- The Cursor: Set to trigger a 'click' event if looking at an object for 5000ms -->
        
          
          <!-- Animation to scale down the ring visualizer over 5 seconds to show progression -->
          <a-animation begin="fusing" easing="linear" attribute="scale" color="#00ffcc"
                       dur="5000" from="1 1 1" to="0.1 0.1 0.1"></a-animation>
          <!-- Reset the ring visualizer if looking away -->
          <a-animation begin="mouseleave" easing="linear" attribute="scale"
                       dur="100" to="1 1 1"></a-animation>
        

        <!-- THE SWORD -->
        <!-- Fixed to the bottom right of the camera view -->
        
          
          <!-- Blade Visual Construction -->
          
            <!-- Hilt / Guard -->
            <a-box position="0 0 0" scale="0.15 0.03 0.03" material="color: #8c763d"></a-box>
            <!-- Handle -->
            <a-cylinder position="0 -0.1 0" radius="0.015" height="0.15" material="color: #4a3728"></a-cylinder>
            <!-- Metal Blade -->
            <a-box position="0 0.3 0" scale="0.04 0.5 0.01" material="color: #d1d5db; metalness: 0.8; roughness: 0.2"></a-box>
          

          <!-- Slashing Animation Configuration -->
          <!-- Rotates rapidly outward when triggered by the 'start-slash' event, then returns -->
          <a-animation attribute="rotation"
                       begin="start-slash"
                       dur="150"
                       from="0 0 0"
                       to="20 -60 -40"
                       direction="alternate"
                       repeat="1"
                       easing="easeOutQuad">
          </a-animation>
        

      

      <!-- ENEMIES: THE SLIMES -->
      <!-- Slime 1 (Center-Left) -->
      
        <!-- Main body sphere -->
        <a-sphere radius="0.5" material="color: #2ecc71; opacity: 0.85; roughness: 0.3" position="0 0 0"></a-sphere>
        <!-- Left eye -->
        <a-sphere radius="0.06" material="color: #ffffff" position="-0.15 0.1 0.45">
          <a-sphere radius="0.03" material="color: #000000" position="0 0 0.04"></a-sphere>
        </a-sphere>
        <!-- Right eye -->
        <a-sphere radius="0.06" material="color: #ffffff" position="0.15 0.1 0.45">
          <a-sphere radius="0.03" material="color: #000000" position="0 0 0.04"></a-sphere>
        </a-sphere>
      

      <!-- Slime 2 (Center-Right) -->
      
        <a-sphere radius="0.5" material="color: #2ecc71; opacity: 0.85; roughness: 0.3" position="0 0 0"></a-sphere>
        <a-sphere radius="0.06" material="color: #ffffff" position="-0.15 0.1 0.45">
          <a-sphere radius="0.03" material="color: #000000" position="0 0 0.04"></a-sphere>
        </a-sphere>
        <a-sphere radius="0.06" material="color: #ffffff" position="0.15 0.1 0.45">
          <a-sphere radius="0.03" material="color: #000000" position="0 0 0.04"></a-sphere>
        </a-sphere>
      

      <!-- Slime 3 (Far Left) -->
      
        <a-sphere radius="0.5" material="color: #2ecc71; opacity: 0.85; roughness: 0.3" position="0 0 0"></a-sphere>
        <a-sphere radius="0.06" material="color: #ffffff" position="-0.15 0.1 0.45">
          <a-sphere radius="0.03" material="color: #000000" position="0 0 0.04"></a-sphere>
        </a-sphere>
        <a-sphere radius="0.06" material="color: #ffffff" position="0.15 0.1 0.45">
          <a-sphere radius="0.03" material="color: #000000" position="0 0 0.04"></a-sphere>
        </a-sphere>
      

    </a-scene>
  </body>
</html>
